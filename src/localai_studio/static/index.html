<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LocalAI Studio</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-title">LocalAI Studio</span>
        <span id="ollama-status" class="status-pill status-offline">Ollama: checking</span>
      </div>
      <button id="new-chat-btn" class="btn btn-primary">+ New Conversation</button>
      <div class="sidebar-section">
        <div class="section-label">Conversations</div>
        <ul id="conversation-list" class="conv-list"></ul>
      </div>
      <div class="sidebar-footer">
        <button id="theme-toggle-btn" class="btn btn-ghost">Toggle Theme</button>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div class="topbar-left">
          <input id="conv-title-input" type="text" class="title-input" value="New Conversation" aria-label="Conversation title" />
          <select id="model-select" class="select-input" aria-label="Select model"></select>
        </div>
        <div class="topbar-actions">
          <button id="toggle-settings-btn" class="btn btn-ghost">Model &amp; Prompt Settings</button>
          <button id="pull-model-btn" class="btn btn-ghost">Pull Model</button>
          <button id="delete-model-btn" class="btn btn-ghost">Delete Model</button>
        </div>
      </header>

      <section id="settings-drawer" class="settings-drawer hidden">
        <div class="settings-grid">
          <div class="field">
            <label for="prompt-preset-select">Saved System Prompt Presets</label>
            <div style="display:flex;gap:8px;">
              <select id="prompt-preset-select" class="select-input" style="flex:1;"><option value="">-- Select preset --</option></select>
              <button id="save-preset-btn" class="btn btn-ghost" type="button">Save Preset</button>
              <button id="delete-preset-btn" class="btn btn-ghost" type="button">Delete</button>
            </div>
            <label for="system-prompt-input">System Prompt</label>
            <textarea id="system-prompt-input" rows="3" placeholder="Optional instructions for the model..."></textarea>
          </div>
          <div class="params-grid">
            <label>Temperature <input id="param-temp" type="number" step="0.1" min="0" max="2" value="0.7" /></label>
            <label>Top P <input id="param-top-p" type="number" step="0.05" min="0" max="1" value="0.9" /></label>
            <label>Top K <input id="param-top-k" type="number" step="1" min="1" max="200" value="40" /></label>
            <label>Context (num_ctx) <input id="param-ctx" type="number" step="512" min="256" max="131072" value="4096" /></label>
          </div>
        </div>
        <div class="drawer-actions">
          <button id="save-settings-btn" class="btn btn-primary">Save Conversation Settings</button>
        </div>
      </section>

      <section id="chat-messages" class="chat-messages"></section>

      <footer class="composer">
        <div id="attachment-bar" class="attachment-bar"></div>
        <div class="composer-row">
          <label class="btn btn-ghost file-label">
            Attach File/Image
            <input id="file-input" type="file" hidden />
          </label>
          <textarea id="prompt-input" rows="2" placeholder="Send a message to your local model... (Enter to send, Shift+Enter for newline)"></textarea>
          <button id="send-btn" class="btn btn-primary">Send</button>
        </div>
      </footer>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
